listener 1883
# SEC-001: Autenticação obrigatória — nenhum cliente anônimo permitido
# Para gerar as credenciais no servidor Ubuntu:
#   docker exec -it sentinela_mosquitto mosquitto_passwd -c /mosquitto/config/passwd frigate
#   docker exec -it sentinela_mosquitto mosquitto_passwd /mosquitto/config/passwd sentinela
# Depois reinicie: docker compose restart mosquitto
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# Performance: limite de mensagens por conexão
max_inflight_messages 100
max_queued_messages 1000


