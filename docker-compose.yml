services:
  frigate:
    container_name: sentinela_frigate
    privileged: true
    restart: unless-stopped
    image: ghcr.io/blakeblackshear/frigate:stable
    shm_size: "1gb" # Crucial for high-res streams without frame drops
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128 # Intel Jasper Lake iGPU
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./frigate/config:/config
      - ./frigate/storage:/media/frigate
      - type: tmpfs # 1GB RAM tmpfs for ultra-low latency cache
        target: /tmp/cache
        tmpfs:
          size: 1000000000
    ports:
      - "5000:5000"
      - "8554:8554"   # RTSP Feeds
      - "8555:8555/tcp" # WebRTC
      - "8555:8555/udp" # WebRTC
      - "1984:1984"   # go2rtc API
    environment:
      - FRIGATE_RTSP_PASSWORD=sentinela_secret
    depends_on:
      - mosquitto

  mosquitto:
    container_name: sentinela_mosquitto
    image: eclipse-mosquitto:2.0
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log

  backend:
    container_name: sentinela_backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ./backend/data:/app/data
      - ./frigate/storage:/media/frigate:ro
    environment:
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
      - FRIGATE_API_URL=http://frigate:5000
      - GO2RTC_API_URL=http://frigate:1984
      - DATABASE_URL=sqlite+aiosqlite:////app/data/sentinela.db
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    depends_on:
      - mosquitto
      - frigate

  frontend:
    container_name: sentinela_frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=/api
      - NEXT_PUBLIC_WS_URL=/ws
      - NEXT_PUBLIC_GO2RTC_URL=/go2rtc
    depends_on:
      - backend

  nginx:
    container_name: sentinela_nginx
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
      - frigate
