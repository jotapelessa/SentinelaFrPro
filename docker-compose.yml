services:
  frigate:
    container_name: sentinela_frigate
    # SEC-005: privileged substituído por capabilities específicas + device explícito
    # Mantido por ora pois /dev/dri requer acesso direto. Avaliar se cap_add resolve.
    privileged: true
    restart: unless-stopped
    image: ghcr.io/blakeblackshear/frigate:stable
    shm_size: "512mb"
    cpu_shares: 1024
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./frigate/config:/config
      - ./frigate/storage:/media/frigate
      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          size: 1000000000
    ports:
      - "5000:5000"
      - "8554:8554"
      - "8555:8555/tcp"
      - "8555:8555/udp"
      - "1984:1984"
    environment:
      - TZ=America/Sao_Paulo
      # SEC-006: secrets via .env — nunca hardcoded aqui
      - FRIGATE_RTSP_USER=${FRIGATE_RTSP_USER:-admin}
      - FRIGATE_RTSP_PASSWORD=${FRIGATE_RTSP_PASSWORD}
      - FRIGATE_MQTT_USER=${FRIGATE_MQTT_USER:-frigate}
      - FRIGATE_MQTT_PASSWORD=${FRIGATE_MQTT_PASSWORD}
      - LIBVA_DRIVER_NAME=iHD
    depends_on:
      mosquitto:
        condition: service_healthy
    # INF-002: healthcheck para que depends_on aguarde o serviço estar saudável
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:5000/api/version || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  mosquitto:
    container_name: sentinela_mosquitto
    image: eclipse-mosquitto:2.0
    restart: unless-stopped
    cpu_shares: 256
    ports:
      - "1883:1883"
    environment:
      - TZ=America/Sao_Paulo
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    # INF-002: healthcheck MQTT
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h localhost -t '$$SYS/sentinela/health' -m 'ok' -u ${FRIGATE_MQTT_USER:-frigate} -P ${FRIGATE_MQTT_PASSWORD:-} 2>/dev/null || mosquitto_pub -h localhost -t '$$SYS/sentinela/health' -m 'ok' 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  backend:
    container_name: sentinela_backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    cpu_shares: 512
    devices:
      - /dev/dri:/dev/dri
    ports:
      - "8080:8080"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /sys:/sys:ro
      - ./backend/data:/app/data
      - ./frigate/storage:/media/frigate
      - ./frigate/config:/config
      # SEC-003: socket Docker exposto apenas read-only. Avaliar migração para socket-proxy.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - TZ=America/Sao_Paulo
      - LIBVA_DRIVER_NAME=iHD
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
      # SEC-001: credenciais MQTT via .env
      - MQTT_USER=${FRIGATE_MQTT_USER:-sentinela}
      - MQTT_PASSWORD=${FRIGATE_MQTT_PASSWORD}
      - FRIGATE_API_URL=http://frigate:5000
      - GO2RTC_API_URL=http://frigate:1984
      - DATABASE_URL=sqlite+aiosqlite:////app/data/sentinela.db
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    depends_on:
      mosquitto:
        condition: service_healthy
      frigate:
        condition: service_healthy
    # INF-002: healthcheck backend
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s

  frontend:
    container_name: sentinela_frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    cpu_shares: 256
    environment:
      - TZ=America/Sao_Paulo
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_API_URL=/api
      - NEXT_PUBLIC_WS_URL=/ws
      - NEXT_PUBLIC_GO2RTC_URL=/go2rtc
    volumes:
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      backend:
        condition: service_healthy
    # INF-002: healthcheck frontend
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s

  nginx:
    container_name: sentinela_nginx
    image: nginx:alpine
    restart: unless-stopped
    cpu_shares: 256
    ports:
      - "8088:80"
    environment:
      - TZ=America/Sao_Paulo
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
      frigate:
        condition: service_healthy
    # INF-002: healthcheck nginx
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:80/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
