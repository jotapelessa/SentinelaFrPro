services:
  frigate:
    container_name: sentinela_frigate
    privileged: true
    restart: unless-stopped
    image: ghcr.io/blakeblackshear/frigate:stable
    shm_size: "1gb"
    cpu_shares: 1024
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./frigate/config:/config
      - ./frigate/storage:/media/frigate
      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          size: 1000000000
    ports:
      - "5000:5000"
      - "8554:8554"
      - "8555:8555/tcp"
      - "8555:8555/udp"
      - "1984:1984"
    environment:
      - TZ=America/Sao_Paulo
      - FRIGATE_RTSP_PASSWORD=sentinela_secret
      - LIBVA_DRIVER_NAME=iHD
    depends_on:
      - mosquitto

  mosquitto:
    container_name: sentinela_mosquitto
    image: eclipse-mosquitto:2.0
    restart: unless-stopped
    cpu_shares: 256
    ports:
      - "1883:1883"
    environment:
      - TZ=America/Sao_Paulo
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log

  backend:
    container_name: sentinela_backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    cpu_shares: 512
    devices:
      - /dev/dri:/dev/dri
    ports:
      - "8080:8080"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /sys:/sys:ro
      - ./backend/data:/app/data
      - ./frigate/storage:/media/frigate:ro
      - ./frigate/config:/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - TZ=America/Sao_Paulo
      - LIBVA_DRIVER_NAME=iHD
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
      - FRIGATE_API_URL=http://frigate:5000
      - GO2RTC_API_URL=http://frigate:1984
      - DATABASE_URL=sqlite+aiosqlite:////app/data/sentinela.db
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-8857963953:AAFsPQ965S6IgoEaWPkTghMbf6Qv6YCWu0E}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:--1003995215102}
    depends_on:
      - mosquitto
      - frigate

  frontend:
    container_name: sentinela_frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    cpu_shares: 256
    environment:
      - TZ=America/Sao_Paulo
      - NEXT_PUBLIC_API_URL=/api
      - NEXT_PUBLIC_WS_URL=/ws
      - NEXT_PUBLIC_GO2RTC_URL=/go2rtc
    volumes:
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - backend

  nginx:
    container_name: sentinela_nginx
    image: nginx:alpine
    restart: unless-stopped
    cpu_shares: 256
    ports:
      - "8088:80"
    environment:
      - TZ=America/Sao_Paulo
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
      - frigate

