mqtt:
  enabled: true
  host: mosquitto
  port: 1883
  topic_prefix: frigate
  client_id: frigate_nvr

# Detailed Structured Logging
logger:
  default: info
  logs:
    frigate.record: info
    frigate.detectors: info
    frigate.events: info
    frigate.video: info

# Intel Jasper Lake N5105 Hardware Acceleration (VAAPI)
ffmpeg:
  hwaccel_args: preset-vaapi


# Global Model Config (ensures detector frame resizing matches OpenVINO 300x300 input)
model:
  path: /openvino-model/ssdlite_mobilenet_v2.xml
  width: 300
  height: 300
  input_tensor: nhwc
  input_pixel_format: bgr
  labelmap_path: /openvino-model/coco_91cl_bkgr.txt

# Detectors: Intel OpenVINO Hardware Acceleration (Auto GPU/CPU fallback)
detectors:
  ov:
    type: openvino
    device: AUTO
    model:
      path: /openvino-model/ssdlite_mobilenet_v2.xml
      width: 300
      height: 300
      input_tensor: nhwc
      input_pixel_format: bgr
      labelmap_path: /openvino-model/coco_91cl_bkgr.txt


# Motion Detection Fine-Tuning (High Sensitivity, Natural Lighting)
motion:
  threshold: 25
  contour_area: 15
  improve_contrast: false

# Global Object Tracking Defaults & Detection Sensitivity
objects:
  track:
    - person
    - car
    - motorcycle
    - bus
    - dog
    - cat
    - bicycle
  filters:
    person:
      min_score: 0.65
      threshold: 0.72
      min_area: 1200
    car:
      min_score: 0.70
      threshold: 0.80
      min_area: 5000
    motorcycle:
      min_score: 0.70
      threshold: 0.78
      min_area: 3000
    bus:
      min_score: 0.70
      threshold: 0.80
      min_area: 7000
    bicycle:
      min_score: 0.70
      threshold: 0.78
      min_area: 2000
    dog:
      min_score: 0.72
      threshold: 0.80
      min_area: 2000
    cat:
      min_score: 0.72
      threshold: 0.80
      min_area: 1500

# Watermarked High-Res Snapshots
snapshots:
  enabled: true
  clean_copy: true
  timestamp: true
  bounding_box: true

# go2rtc WebRTC Hub
go2rtc:
  streams:
    camera_principal:
      - rtsp://192.168.1.6:8554/stream#backchannel=0
      - rtsp://192.168.1.6:8554/live#backchannel=0
  webrtc:
    candidates:
      - 192.168.1.247:8555
      - stun:stun.l.google.com:19302


# Câmeras Ativas
cameras:
  camera_principal:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/camera_principal
          input_args: -avoid_negative_ts make_zero -fflags +genpts+discardcorrupt -flags low_delay -strict experimental -analyzeduration 1000M -probesize 1000M -err_detect ignore_err -reorder_queue_size 16 -max_delay 500000 -rtsp_transport tcp
          roles:
            - detect
            - record
    detect:
      enabled: true
      width: 1280
      height: 720
      fps: 5
    record:
      enabled: true
      continuous:
        days: 0
      motion:
        days: 3
      alerts:
        pre_capture: 7
        post_capture: 7
        retain:
          days: 14
          mode: active_objects
      detections:
        pre_capture: 7
        post_capture: 7
        retain:
          days: 14
          mode: active_objects
    snapshots:
      enabled: true
      bounding_box: true
    zones:
      zona_monitoramento:
        coordinates: 10,720,1270,720,1270,10,10,10
        objects:
          - person
          - car
          - motorcycle
          - bus
          - dog
          - cat
          - bicycle
      zona_entrada:
        coordinates: 200,720,1080,720,1080,250,200,250
        objects:
          - person
          - car
          - motorcycle
          - bus
          - dog
          - cat
          - bicycle
    review:
      alerts:
        labels:
          - person
          - car
          - motorcycle
          - bus
          - dog
          - cat
          - bicycle
        required_zones: []
      detections:
        labels:
          - person
          - car
          - motorcycle
          - bus
          - dog
          - cat
          - bicycle
        required_zones: []






