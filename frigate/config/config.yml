mqtt:
  enabled: true
  host: mosquitto
  port: 1883
  topic_prefix: frigate
  client_id: frigate_nvr
logger:
  default: info
  logs:
    frigate.record: info
    frigate.detectors: info
    frigate.events: info
    frigate.video: info
ffmpeg:
  hwaccel_args: preset-intel-qsv-h264
  output_args:
    record: -f segment -segment_time 10 -segment_format mp4 -reset_timestamps 1 -strftime
      1 -c:v copy -bsf:v h264_redundant_pps -c:a copy
model:
  path: /openvino-model/ssdlite_mobilenet_v2.xml
  width: 300
  height: 300
  input_tensor: nhwc
  input_pixel_format: bgr
  labelmap_path: /openvino-model/coco_91cl_bkgr.txt
detectors:
  ov:
    type: openvino
    device: GPU
    model_path: /openvino-model/ssdlite_mobilenet_v2.xml
    model:
      width: 300
      height: 300
      input_tensor: nhwc
      input_pixel_format: bgr
      path: /openvino-model/ssdlite_mobilenet_v2.xml
motion:
  threshold: 25
  contour_area: 20
  improve_contrast: true
objects:
  track:
  - person
  - car
  - motorcycle
  - bus
  - dog
  - cat
  - bicycle
  filters:
    person:
      min_score: 0.5
      threshold: 0.6
      min_area: 400
    car:
      min_score: 0.55
      threshold: 0.65
      min_area: 1200
    motorcycle:
      min_score: 0.55
      threshold: 0.65
      min_area: 800
    bus:
      min_score: 0.55
      threshold: 0.65
      min_area: 2000
    bicycle:
      min_score: 0.55
      threshold: 0.65
      min_area: 500
    dog:
      min_score: 0.55
      threshold: 0.65
      min_area: 500
    cat:
      min_score: 0.55
      threshold: 0.65
      min_area: 400
snapshots:
  enabled: true
  clean_copy: true
  timestamp: true
  bounding_box: true
go2rtc:
  streams:
    camera_secundaria:
    - rtsp://192.168.1.6:8554/live
    camera_principal:
    - rtsp://127.0.0.1:8554/camera_secundaria
    cam_192_168_1_136:
    - rtsp://192.168.1.136:8554/live
  webrtc:
    candidates:
    - 100.93.129.91:8555
    - 192.168.1.247:8555
    - stun:8555
    - stun:stun.l.google.com:19302
cameras:
  camera_secundaria:
    enabled: true
    ffmpeg:
      inputs:
      - path: rtsp://127.0.0.1:8554/camera_secundaria
        input_args: preset-rtsp-restream
        roles:
        - record
      - path: rtsp://127.0.0.1:8554/camera_secundaria
        input_args: preset-rtsp-restream
        roles:
        - detect
    detect:
      enabled: true
      width: 640
      height: 360
      fps: 10
    record:
      enabled: true
      continuous:
        days: 0
      motion:
        days: 9
      alerts:
        pre_capture: 10
        post_capture: 10
        retain:
          days: 14
          mode: active_objects
      detections:
        pre_capture: 10
        post_capture: 10
        retain:
          days: 14
          mode: active_objects
    snapshots:
      enabled: true
      bounding_box: true
    review:
      alerts:
        labels:
        - person
        - car
        - motorcycle
        - bus
        - dog
        - cat
        - bicycle
        required_zones: []
      detections:
        labels:
        - person
        - car
        - motorcycle
        - bus
        - dog
        - cat
        - bicycle
        required_zones: []
    objects:
      track:
      - motorcycle
      - person
      - dog
      - car
      filters:
        person:
          threshold: 0.7
      mask: 0.009,0.342,0.198,0.36,0.195,0.561,0.523,0.6,0.509,0.795,0.675,0.989,0.008,0.986
    motion:
      threshold: 30
      mask: 0.539,0.335,0.523,0.792,0.694,0.997,0.98,0.988,0.991,0.023,0.009,0.006,0.004,0.323,0.204,0.344
    zones:
      detecgggg:
        coordinates: 0.206,0.357,0.201,0.544,0.528,0.588,0.535,0.351
        loitering_time: 0
        objects:
        - car
        - person
  camera_principal:
    enabled: false
    ffmpeg:
      inputs:
      - path: rtsp://127.0.0.1:8554/camera_secundaria
        input_args: preset-rtsp-restream
        roles:
        - record
        - detect
    detect:
      enabled: false
      width: 640
      height: 360
      fps: 5
    record:
      enabled: false
    snapshots:
      enabled: true
      bounding_box: true
  cam_192_168_1_136:
    enabled: false
    ffmpeg:
      inputs:
      - path: rtsp://127.0.0.1:8554/cam_192_168_1_136
        input_args: preset-rtsp-restream
        roles:
        - record
      - path: rtsp://127.0.0.1:8554/cam_192_168_1_136
        input_args: preset-rtsp-restream
        roles:
        - detect
    detect:
      width: 640
      height: 360
      fps: 10
      enabled: false
    snapshots:
      enabled: false
      bounding_box: true
    objects:
      track:
      - person
      - car
      - motorcycle
      - dog
      filters:
        person:
          threshold: 0.75
    motion:
      threshold: 40
      mask: 6,229,626,125,633,6,13,26
    record:
      enabled: false
      motion:
        days: 14
      continuous:
        days: 0
      alerts:
        pre_capture: 10
        post_capture: 10
        retain:
          days: 14
          mode: active_objects
      detections:
        pre_capture: 10
        post_capture: 10
        retain:
          days: 14
          mode: active_objects
    review:
      alerts:
        labels:
        - person
        - car
        - motorcycle
        - bus
        - dog
        - cat
        - bicycle
        required_zones: []
      detections:
        labels:
        - person
        - car
