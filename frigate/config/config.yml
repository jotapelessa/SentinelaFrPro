mqtt:
  enabled: true
  host: mosquitto
  port: 1883
  topic_prefix: frigate
  client_id: frigate_nvr

# Detailed Structured Logging
logger:
  default: info
  logs:
    frigate.record: info
    frigate.detectors: info
    frigate.events: info
    frigate.video: info

# Intel Jasper Lake N5105 Hardware Acceleration (VAAPI)
ffmpeg:
  hwaccel_args: preset-vaapi


# Model Configuration for OpenVINO (Pre-baked in Frigate)
model:
  width: 300
  height: 300
  input_tensor: nhwc
  input_pixel_format: bgr
  path: /openvino-model/ssdlite_mobilenet_v2.xml

# Detectors: Intel OpenVINO Hardware Acceleration (Auto GPU/CPU fallback)
detectors:
  ov:
    type: openvino
    device: AUTO
    model:
      width: 300
      height: 300
      input_tensor: nhwc
      input_pixel_format: bgr
      path: /openvino-model/ssdlite_mobilenet_v2.xml


# Motion Detection Fine-Tuning (High Sensitivity, Low Noise)
motion:
  threshold: 25
  contour_area: 10
  improve_contrast: true

# Global Object Tracking Defaults & Detection Sensitivity
objects:
  track:
    - person
    - car
    - motorcycle
    - bus
    - dog
    - cat
  filters:
    person:
      min_score: 0.45
      threshold: 0.55
    car:
      min_score: 0.45
      threshold: 0.55
    motorcycle:
      min_score: 0.45
      threshold: 0.55

# Watermarked High-Res Snapshots
snapshots:
  enabled: true
  clean_copy: true
  timestamp: true
  bounding_box: true

# go2rtc WebRTC Hub
go2rtc:
  streams:
    camera_principal:
      - rtsp://192.168.1.6:554/stream
      - rtsp://192.168.1.6:554/live
      - rtsp://192.168.1.6:8554/stream
      - rtsp://192.168.1.6:8554/live
  webrtc:
    candidates:
      - 192.168.1.252:8555
      - stun:stun.l.google.com:19302


# Câmeras Ativas
cameras:
  camera_principal:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/camera_principal
          input_args: preset-rtsp-restream
          roles:
            - detect
            - record
    detect:
      enabled: true
      width: 1280
      height: 720
      fps: 5
    record:
      enabled: true
    snapshots:
      enabled: true
      bounding_box: true
    zones:
      zona_monitoramento:
        coordinates: 0,720,1280,720,1280,0,0,0
        objects:
          - person
          - car
          - motorcycle
    review:
      alerts:
        required_zones:
          - zona_monitoramento






