mqtt:
  enabled: true
  host: mosquitto
  port: 1883
  topic_prefix: frigate
  client_id: frigate_nvr

# Detailed Structured Logging
logger:
  default: info
  logs:
    frigate.record: info
    frigate.detectors: info
    frigate.events: info
    frigate.video: info

# Intel Jasper Lake N5105 Hardware Acceleration (VAAPI)
ffmpeg:
  hwaccel_args: preset-vaapi


# Detectors: Multi-Core TensorFlow Lite Load Balancing (Jasper Lake 4 Cores)
detectors:
  cpu1:
    type: cpu
    num_threads: 2


# Motion Detection Fine-Tuning (Intel N5105 Optimized)
motion:
  threshold: 25
  contour_area: 10
  improve_contrast: true

# Global Object Tracking Defaults
objects:
  track:
    - person
    - car
    - motorcycle
    - bus
    - dog
    - cat

# Watermarked High-Res Snapshots
snapshots:
  enabled: true
  clean_copy: true
  timestamp: true
  bounding_box: true

# go2rtc WebRTC Hub
go2rtc:
  streams:
    camera_principal:
      - rtsp://192.168.1.6:8554/stream#transport=tcp
      - rtsp://192.168.1.6:8554/stream#transport=udp
      - rtsp://192.168.1.6:8554/live#transport=tcp
      - rtsp://192.168.1.6:8554/live#transport=udp
      - rtsp://192.168.1.6:8554/
      - ffmpeg:rtsp://192.168.1.6:8554/stream#video=h264
  webrtc:
    candidates:
      - 192.168.1.252:8555
      - stun:8555


# Câmeras Ativas
cameras:
  camera_principal:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/camera_principal
          input_args: preset-rtsp-restream
          roles:
            - detect
            - record
    detect:
      enabled: true
      width: 1280
      height: 720
      fps: 5
    record:
      enabled: true
    zones:
      zona_monitoramento:
        coordinates: 0,720,1280,720,1280,100,0,100
        objects:
          - person
          - car
          - motorcycle






