    cam_192_168_1_93_720p:
    - rtsp://127.0.0.1:8554/cam_192_168_1_93_sub
  webrtc:
    candidates:
    - 100.93.129.91:8555
    - 192.168.1.247:8555
    - stun:8555
    - stun:stun.l.google.com:19302
cameras:
  cam_192_168_1_189:
    enabled: true
    ffmpeg:
      hwaccel_args: preset-intel-qsv-h264
      inputs:
      - path: rtsp://127.0.0.1:8554/cam_192_168_1_189
        input_args: preset-rtsp-restream
        roles:
        - record
        - detect
      output_args:
        record: -f segment -segment_time 10 -segment_format mp4 -reset_timestamps 1 -strftime 1 -c:v copy -bsf:v h264_redundant_pps -c:a aac
    detect:
      width: 800
      height: 448
      fps: 5
      enabled: true
    snapshots:
      enabled: true
      bounding_box: true
    objects:
      track:
      - person
      - car
      - motorcycle
      - dog
      filters:
        person:
          threshold: 0.7
    motion:
      threshold: 25
    record:
      enabled: true
      motion:
        days: 14
      continuous:
        days: 0
      alerts:
        pre_capture: 10
        post_capture: 10
        retain:
          days: 14
          mode: active_objects
      detections:
        pre_capture: 10
        post_capture: 10
        retain:
          days: 14
          mode: active_objects
    review:
      alerts:
        labels:
        - person
        - car
        - motorcycle
        - bus
        - dog
        - cat
        - bicycle
        required_zones: []
      detections:
