mqtt:
  enabled: true
  host: mosquitto
  port: 1883
  topic_prefix: frigate
  client_id: frigate_nvr

# Intel Jasper Lake N5105 Hardware Acceleration (VAAPI)
ffmpeg:
  hwaccel_args: preset-vaapi

# OpenVINO AI Object Detector (Intel iGPU / CPU AVX2)
detectors:
  ov:
    type: openvino
    device: GPU # Uses Intel UHD Gen11 /dev/dri/renderD128, fallback to CPU

# Global Object Tracking Defaults
objects:
  track:
    - person
    - car
    - motorcycle
    - bus
    - truck
    - dog
    - cat
  filters:
    person:
      min_score: 0.60
      threshold: 0.70
    car:
      min_score: 0.60
      threshold: 0.70

# Video Recording and Retention Policy (SSD NVMe)
record:
  enabled: true
  retain:
    days: 14
    mode: all
  events:
    pre_capture: 10
    post_capture: 15
    retain:
      default: 30
      mode: motion
      objects:
        person: 45
        car: 45

# High-resolution Snapshots for Alerts
snapshots:
  enabled: true
  clean_copy: true
  timestamp: true
  bounding_box: true
  crop: false
  retain:
    default: 30

# Live WebRTC & RTSP Hub (go2rtc)
go2rtc:
  streams:
    camera_principal:
      - rtsp://192.168.1.6:8554/stream
      - ffmpeg:camera_principal#video=h264#hardware
  webrtc:
    listen: ":8555"
    candidates:
      - 127.0.0.1:8555
      - stun:8555

# Configured Cameras
cameras:
  camera_principal:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/camera_principal
          roles:
            - detect
            - record
    detect:
      enabled: true
      width: 1280
      height: 720
      fps: 5
    zones:
      zona_monitoramento:
        coordinates: 0,720,1280,720,1280,100,0,100
        objects:
          - person
          - car
          - motorcycle
