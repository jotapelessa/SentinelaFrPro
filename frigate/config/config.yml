mqtt:
  enabled: true
  host: mosquitto
  port: 1883
  topic_prefix: frigate
  client_id: frigate_nvr

# Detailed Structured Logging
logger:
  default: info
  logs:
    frigate.record: info
    frigate.detectors: info
    frigate.events: info
    frigate.video: info

# Intel Jasper Lake N5105 Hardware Acceleration (QSV)
ffmpeg:
  hwaccel_args: preset-intel-qsv-h264
  output_args:
    record: preset-record-generic


# Global Model Config (ensures detector frame resizing matches OpenVINO 300x300 input)
model:
  path: /openvino-model/ssdlite_mobilenet_v2.xml
  width: 300
  height: 300
  input_tensor: nhwc
  input_pixel_format: bgr
  labelmap_path: /openvino-model/coco_91cl_bkgr.txt

# Detectors: Intel OpenVINO Hardware Acceleration (Auto GPU/CPU fallback)
detectors:
  ov:
    type: openvino
    device: AUTO
    model:
      path: /openvino-model/ssdlite_mobilenet_v2.xml
      width: 300
      height: 300
      input_tensor: nhwc
      input_pixel_format: bgr
      labelmap_path: /openvino-model/coco_91cl_bkgr.txt


# Motion Detection Fine-Tuning (High Sensitivity, Natural Lighting)
motion:
  threshold: 25
  contour_area: 30
  improve_contrast: false

# Global Object Tracking Defaults & Detection Sensitivity
objects:
  track:
    - person
    - car
    - motorcycle
    - bus
    - dog
    - cat
    - bicycle
  filters:
    person:
      min_score: 0.65
      threshold: 0.72
      min_area: 1200
    car:
      min_score: 0.70
      threshold: 0.80
      min_area: 5000
    motorcycle:
      min_score: 0.70
      threshold: 0.78
      min_area: 3000
    bus:
      min_score: 0.70
      threshold: 0.80
      min_area: 7000
    bicycle:
      min_score: 0.70
      threshold: 0.78
      min_area: 2000
    dog:
      min_score: 0.72
      threshold: 0.80
      min_area: 2000
    cat:
      min_score: 0.72
      threshold: 0.80
      min_area: 1500

# Watermarked High-Res Snapshots
snapshots:
  enabled: true
  clean_copy: true
  timestamp: true
  bounding_box: true

# go2rtc WebRTC Hub
go2rtc:
  streams:
    camera_principal:
      - rtsp://192.168.1.6:8554/stream#backchannel=0
    camera_principal_h264:
      - "ffmpeg:camera_principal#video=h264#hardware"
  webrtc:
    candidates:
      - 100.93.129.91:8555
      - 192.168.1.247:8555
      - stun:8555
      - stun:stun.l.google.com:19302



# Câmeras Ativas
cameras:
  camera_principal:
    enabled: true
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/camera_principal
          input_args: preset-rtsp-restream -fflags +genpts+discardcorrupt -err_detect ignore_err
          roles:
            - record
        - path: rtsp://127.0.0.1:8554/camera_principal
          input_args: preset-rtsp-restream -fflags +genpts+discardcorrupt -err_detect ignore_err
          roles:
            - detect
    detect:
      enabled: true
      width: 640
      height: 360
      fps: 3
    record:
      enabled: true
      continuous:
        days: 0
      motion:
        days: 3
      alerts:
        pre_capture: 10
        post_capture: 10
        retain:
          days: 14
          mode: active_objects
      detections:
        pre_capture: 10
        post_capture: 10
        retain:
          days: 14
          mode: active_objects
    snapshots:
      enabled: true
      bounding_box: true
    zones:
      zona_monitoramento:
        coordinates: 5,360,635,360,635,5,5,5
        objects:
          - person
          - car
          - motorcycle
          - bus
          - dog
          - cat
          - bicycle
      zona_entrada:
        coordinates: 100,360,540,360,540,125,100,125
        objects:
          - person
          - car
          - motorcycle
          - bus
          - dog
          - cat
          - bicycle
    review:
      alerts:
        labels:
          - person
          - car
          - motorcycle
          - bus
          - dog
          - cat
          - bicycle
        required_zones: []
      detections:
        labels:
          - person
          - car
          - motorcycle
          - bus
          - dog
          - cat
          - bicycle
        required_zones: []






