mqtt:
  enabled: true
  host: mosquitto
  port: 1883
  topic_prefix: frigate
  client_id: frigate_nvr

# Detailed Structured Logging
logger:
  default: info
  logs:
    frigate.record: info
    frigate.detectors: info
    frigate.events: info
    frigate.video: info

# Intel Jasper Lake N5105 Hardware Acceleration (VAAPI)
ffmpeg:
  hwaccel_args: preset-vaapi


# Detectors: Limit detector threads to prevent CPU spikes
detectors:
  cpu1:
    type: cpu
    num_threads: 1

# Motion Detection Fine-Tuning (Intel N5105 Optimized)
motion:
  threshold: 25
  contour_area: 10
  improve_contrast: true

# Global Object Tracking Defaults
objects:
  track:
    - person
    - car
    - motorcycle
    - bus
    - dog
    - cat

# Video Recording Policy (NVMe SSD)
record:
  enabled: true
  retain:
    days: 14
    mode: all
  events:
    pre_capture: 10
    post_capture: 15
    retain:
      default: 30
      mode: motion

# Watermarked High-Res Snapshots
snapshots:
  enabled: true
  clean_copy: true
  timestamp: true
  bounding_box: true

# go2rtc WebRTC Hub
go2rtc:
  streams:
    camera_principal:
      - rtsp://192.168.1.6:554/stream#transport=tcp
    cam_192_168_1_6:
      - rtsp://192.168.1.6:554/stream#transport=tcp
  webrtc:
    listen: ":8555"
    candidates:
      - 192.168.1.252:8555
      - stun:8555


# Câmeras Ativas
cameras:
  camera_principal:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/camera_principal
          input_args: preset-rtsp-restream
          roles:
            - detect
            - record
    detect:
      enabled: true
      width: 1280
      height: 720
      fps: 5
    live:
      stream_name: camera_principal
    zones:
      zona_monitoramento:
        coordinates: 0,720,1280,720,1280,100,0,100
        objects:
          - person
          - car
          - motorcycle

  cam_192_168_1_6:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/cam_192_168_1_6
          input_args: preset-rtsp-restream
          roles:
            - detect
            - record
    detect:
      enabled: true
      width: 1280
      height: 720
      fps: 5
    live:
      stream_name: cam_192_168_1_6

