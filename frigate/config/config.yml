mqtt:
  enabled: true
  host: mosquitto
  port: 1883
  topic_prefix: frigate
  client_id: frigate_nvr
logger:
  default: info
  logs:
    frigate.record: info
    frigate.detectors: info
    frigate.events: info
    frigate.video: info
ffmpeg:
  hwaccel_args: preset-intel-qsv-h264
  output_args:
    record: -f segment -segment_time 10 -segment_format mp4 -reset_timestamps 1 -strftime
      1 -avoid_negative_ts make_zero -c:v copy -bsf:v h264_redundant_pps -c:a copy
model:
  path: /openvino-model/ssdlite_mobilenet_v2.xml
  width: 300
  height: 300
  input_tensor: nhwc
  input_pixel_format: bgr
  labelmap_path: /openvino-model/coco_91cl_bkgr.txt
detectors:
  ov:
    type: openvino
    device: GPU
    model_path: /openvino-model/ssdlite_mobilenet_v2.xml
    model:
      width: 300
      height: 300
      input_tensor: nhwc
      input_pixel_format: bgr
      path: /openvino-model/ssdlite_mobilenet_v2.xml
motion:
  threshold: 25
  contour_area: 20
  improve_contrast: true
objects:
  track:
  - person
  - car
  - motorcycle
  - bus
  - dog
  - cat
  - bicycle
  filters:
    person:
      min_score: 0.5
      threshold: 0.6
      min_area: 400
    car:
      min_score: 0.65
      threshold: 0.7
      min_area: 1200
    motorcycle:
      min_score: 0.55
      threshold: 0.65
      min_area: 800
    bus:
      min_score: 0.55
      threshold: 0.65
      min_area: 2000
    bicycle:
      min_score: 0.55
      threshold: 0.65
      min_area: 500
    dog:
      min_score: 0.55
      threshold: 0.65
      min_area: 500
    cat:
      min_score: 0.55
      threshold: 0.65
      min_area: 400
snapshots:
  enabled: true
  clean_copy: true
  timestamp: true
  bounding_box: true
  quality: 98
  height: 1080
go2rtc:
  streams:
    camera_secundaria:
    - rtsp://192.168.1.6:8554/live
    camera_secundaria_720p:
    - rtsp://192.168.1.6:8554/live
    camera_principal:
    - rtsp://127.0.0.1:8554/camera_secundaria
    camera_principal_720p:
    - rtsp://127.0.0.1:8554/camera_secundaria
    cam_192_168_1_136:
    - rtsp://192.168.1.136:8554/live
  webrtc:
    candidates:
    - 100.93.129.91:8555
    - 192.168.1.247:8555
    - stun:8555
    - stun:stun.l.google.com:19302
cameras:
  camera_secundaria:
    enabled: true
    ffmpeg:
      inputs:
      - path: rtsp://127.0.0.1:8554/camera_secundaria
        input_args: preset-rtsp-restream
        roles:
        - record
        - detect
    detect:
      enabled: true
      width: 640
      height: 360
      fps: 5
    record:
      enabled: true
      continuous:
        days: 0
      motion:
        days: 9
      alerts:
        pre_capture: 10
        post_capture: 10
        retain:
          days: 14
          mode: active_objects
      detections:
        pre_capture: 10
        post_capture: 10
        retain:
          days: 14
          mode: active_objects
    snapshots:
      enabled: true
      bounding_box: true
      quality: 98
      height: 1080
    review:
      alerts:
        labels:
        - person
        - car
        - motorcycle
        - bus
        - dog
        - cat
        - bicycle
        required_zones: []
      detections:
        labels:
        - person
        - car
        - motorcycle
        - bus
        - dog
        - cat
        - bicycle
        required_zones: []
    objects:
      track:
      - person
      - dog
      - motorcycle
      - bicycle
      - cat
      filters:
        person:
          threshold: 0.9
        car:
          threshold: 0.7
          min_score: 0.65
    motion:
      threshold: 30
      contour_area: 20
      improve_contrast: true
      mask:
      - 0.013,0.008,0.001,0.989,0.476,0.998,0.483,0.709,0.497,0.433,0.507,0.005
      - 0.478,0.716,0.471,0.994,0.988,0.998,0.996,0.738
      - 0.5,0.012,0.488,0.44,0.676,0.451,0.666,0.738,0.989,0.751,0.997,0.014
    zones:
      detec:
        coordinates: 0.495,0.433,0.483,0.712,0.668,0.716,0.681,0.445
        inertia: 5
        loitering_time: 2
        friendly_name: Detec
  camera_principal:
    enabled: false
    ffmpeg:
      inputs:
      - path: rtsp://127.0.0.1:8554/camera_secundaria
        input_args: preset-rtsp-restream
        roles:
        - record
        - detect
    detect:
      enabled: false
      width: 640
      height: 360
      fps: 5
    record:
      enabled: false
      continuous:
        days: 0
      motion:
        days: 3
      alerts:
        pre_capture: 10
        post_capture: 10
        retain:
          days: 14
          mode: active_objects
      detections:
        pre_capture: 10
        post_capture: 10
        retain:
          days: 14
          mode: active_objects
    snapshots:
      enabled: true
      bounding_box: true
    review:
      alerts:
        labels: &id001
        - person
        - car
        - motorcycle
        - bus
        - dog
        - cat
        - bicycle
        required_zones: []
      detections:
        labels: *id001
        required_zones: []
  cam_192_168_1_136:
    enabled: false
    ffmpeg:
      inputs:
      - path: rtsp://127.0.0.1:8554/cam_192_168_1_136
        input_args: preset-rtsp-restream
        roles:
        - record
      - path: rtsp://127.0.0.1:8554/cam_192_168_1_136
        input_args: preset-rtsp-restream
        roles:
        - detect
    detect:
      width: 640
      height: 360
      fps: 10
      enabled: false
    snapshots:
      enabled: false
      bounding_box: true
    objects:
      track:
      - person
      - car
      - motorcycle
      - dog
      filters:
        person:
          threshold: 0.75
    motion:
      threshold: 40
      mask: 6,229,626,125,633,6,13,26
    record:
      enabled: false
      motion:
        days: 14
      continuous:
        days: 0
      alerts:
        pre_capture: 10
        post_capture: 10
        retain:
          days: 14
          mode: active_objects
      detections:
        pre_capture: 10
        post_capture: 10
        retain:
          days: 14
          mode: active_objects
    review:
      alerts:
        labels:
        - person
        - car
        - motorcycle
        - bus
        - dog
        - cat
        - bicycle
        required_zones: []
      detections:
        labels:
        - person
        - car
        - motorcycle
        - bus
        - dog
        - cat
        - bicycle
        required_zones: []
    zones: {}
version: 0.17-0
