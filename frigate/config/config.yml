mqtt:
  enabled: true
  host: mosquitto
  port: 1883
  topic_prefix: frigate
  client_id: frigate_nvr

# Detailed Structured Logging
logger:
  default: info
  logs:
    frigate.record: info
    frigate.detectors: info
    frigate.events: info
    frigate.video: info

# Intel Jasper Lake N5105 Hardware Acceleration (VAAPI)
ffmpeg:
  hwaccel_args: preset-vaapi


# Model Configuration for OpenVINO (Pre-baked in Frigate)
model:
  path: /openvino-model/ssdlite_mobilenet_v2.xml

# Detectors: Intel OpenVINO GPU Acceleration (Intel UHD Graphics 11th Gen N5105)
detectors:
  ov:
    type: openvino
    device: GPU


# Motion Detection Fine-Tuning (Intel N5105 Optimized - Low CPU)
motion:
  threshold: 30
  contour_area: 15
  improve_contrast: false

# Global Object Tracking Defaults
objects:
  track:
    - person
    - car
    - motorcycle
    - bus
    - dog
    - cat

# Watermarked High-Res Snapshots
snapshots:
  enabled: true
  clean_copy: true
  timestamp: true
  bounding_box: true

# go2rtc WebRTC Hub
go2rtc:
  streams:
    camera_principal:
      - rtsp://192.168.1.6:8554/stream
      - rtsp://192.168.1.6:554/stream
      - rtsp://192.168.1.6:8554/live
      - rtsp://192.168.1.6:554/live
      - rtsp://192.168.1.6:8554/
  webrtc:
    candidates:
      - 192.168.1.252:8555
      - stun:8555


# Câmeras Ativas
cameras:
  camera_principal:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/camera_principal
          input_args: preset-rtsp-restream
          roles:
            - detect
            - record
    detect:
      enabled: true
      width: 1280
      height: 720
      fps: 5
    record:
      enabled: true
    zones:
      zona_monitoramento:
        coordinates: 0,720,1280,720,1280,100,0,100
        objects:
          - person
          - car
          - motorcycle






