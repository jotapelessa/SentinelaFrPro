name: Android CI & Automatic Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Configure Android SDK
      run: |
        echo "sdk.dir=${ANDROID_HOME:-/usr/local/lib/android/sdk}" > android/local.properties
        cat android/local.properties

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.5'

    - name: Read & Format Version
      id: get_version
      run: |
        VERSION_FILE="android/version.properties"
        if [ -f "$VERSION_FILE" ]; then
          source "$VERSION_FILE"
        fi
        MAJOR=${MAJOR:-001}
        MINOR=${MINOR:-000}
        PATCH=${PATCH:-000}
        BUILD=${BUILD:-001}
        FORMATTED_VERSION="$(printf "%03d.%03d.%03d.%03d" "$((10#$MAJOR))" "$((10#$MINOR))" "$((10#$PATCH))" "$((10#$BUILD))")"
        TAG_NAME="v${FORMATTED_VERSION}"
        echo "version=${FORMATTED_VERSION}" >> $GITHUB_OUTPUT
        echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT
        echo "📦 Compilando Versão: ${FORMATTED_VERSION} (Tag: ${TAG_NAME})"

    - name: Build and Package APKs
      working-directory: android
      env:
        GRADLE_OPTS: "-Dorg.gradle.internal.http.socketTimeout=120000 -Dorg.gradle.internal.http.connectionTimeout=120000"
      run: |
        chmod +x gradlew
        export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
        export ANDROID_SDK_ROOT="$ANDROID_HOME"
        
        # Pré-aceitação canônica de licenças do Android SDK
        mkdir -p "$ANDROID_HOME/licenses" || true
        echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" >> "$ANDROID_HOME/licenses/android-sdk-license"
        echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_HOME/licenses/android-sdk-license"
        echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" >> "$ANDROID_HOME/licenses/android-sdk-preview-license"
        echo "84831b9409646a918e30573bab4c9c91346d8abd" >> "$ANDROID_HOME/licenses/android-sdk-preview-license"
        if command -v sdkmanager &>/dev/null; then
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
        fi

        # Limpar journals de cache corrompidos
        rm -rf ~/.gradle/caches/journal* 2>/dev/null || true

        # Validação do wrapper
        ./gradlew --version || gradle --version
        
        echo "🔨 Compilando APKs TV e Smartphone..."
        if ! ./gradlew :app:assembleTvDebug :app:assembleSmartphoneDebug --no-daemon --stacktrace 2>&1 | tee build_gradle.log; then
          echo "❌ FALHA NA COMPILAÇÃO GRADLE. Últimas 100 linhas:"
          tail -n 100 build_gradle.log
          exit 1
        fi

        echo "### 📋 APKs Encontrados" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        find app/build/outputs/apk/ -name "*.apk" -type f >> $GITHUB_STEP_SUMMARY 2>&1
        echo '```' >> $GITHUB_STEP_SUMMARY
        
        VER="${{ steps.get_version.outputs.version }}"
        DEST="${GITHUB_WORKSPACE}/release-apks"
        mkdir -p "$DEST"
        
        cp app/build/outputs/apk/tv/debug/app-tv-debug.apk "$DEST/sentinela-android-tv-v${VER}.apk"
        cp app/build/outputs/apk/tv/debug/app-tv-debug.apk "$DEST/sentinela-android-tv-latest.apk"
        cp app/build/outputs/apk/smartphone/debug/app-smartphone-debug.apk "$DEST/sentinela-android-smartphone-v${VER}.apk"
        cp app/build/outputs/apk/smartphone/debug/app-smartphone-debug.apk "$DEST/sentinela-android-smartphone-latest.apk"
        
        echo "### ✅ Release APKs Prontos" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        ls -lh "$DEST/" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        
        ls -lh "$DEST/"

    - name: Upload Artifacts to Run Summary
      uses: actions/upload-artifact@v4
      with:
        name: sentinela-apks-v${{ steps.get_version.outputs.version }}
        path: release-apks/*

    - name: Publish to GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.get_version.outputs.tag }}
        name: "Sentinela Pro Client v${{ steps.get_version.outputs.version }}"
        draft: false
        prerelease: false
        make_latest: true
        overwrite: true
        files: |
          release-apks/sentinela-android-tv-v${{ steps.get_version.outputs.version }}.apk
          release-apks/sentinela-android-smartphone-v${{ steps.get_version.outputs.version }}.apk
          release-apks/sentinela-android-tv-latest.apk
          release-apks/sentinela-android-smartphone-latest.apk
        body: |
          # 🛡️ Sentinela Frigate Pro - APKs de Cliente (v${{ steps.get_version.outputs.version }})

          Esta release foi gerada automaticamente pelo pipeline de CI/CD do Sentinela Frigate Pro.

          ### 📦 Aplicativos Disponíveis para Download:
          - 📺 **Android TV / TV Box**: [`sentinela-android-tv-v${{ steps.get_version.outputs.version }}.apk`](https://github.com/jotapelessa/SentinelaFrPro/releases/download/${{ steps.get_version.outputs.tag }}/sentinela-android-tv-v${{ steps.get_version.outputs.version }}.apk)
            * Navegação otimizada para D-Pad / Controle Remoto
            * Suporte a Notificações Flutuantes Picture-in-Picture (PiP compacto 26dp)
            * Suporte a Dual PiP simultâneo com posicionamento inteligente (esquerda/direita)
            * Padrão 720p HD @ 25 FPS H.264 para máxima fluidez sem saturação do decodificador
            * Live Feed contínuo das câmeras com MSE TCP
          - 📱 **Tablet & Smartphone**: [`sentinela-android-smartphone-v${{ steps.get_version.outputs.version }}.apk`](https://github.com/jotapelessa/SentinelaFrPro/releases/download/${{ steps.get_version.outputs.tag }}/sentinela-android-smartphone-v${{ steps.get_version.outputs.version }}.apk)
            * Interface estilo YouTube com feed vertical e suporte a toque
            * Zoom digital de até 5x e grade dinâmica de câmeras
            * Central Master VIP com controle de resolução 720p/1080p para todas as Smart TVs
            * Ferramentas de diagnóstico em 4 rotas de rede (Tailscale HTTPS, Tailscale IP, mDNS, LAN)
            * Confirmação visual e auditoria do reboot seguro do host Ubuntu
            * Controle granular de taxa de quadros e silenciamento por FAB

          ### 🚀 Melhorias Desta Versão (Build 154):
          - 🧹 **Purga em Cascata de Câmeras**: Remoção no Frigate config, streams do go2rtc e chamada DELETE REST garantindo desativação instantânea sem streams fantasmas.
          - 📸 **Web PiP & Mosaico 2×2**: Botões de Foto HD (JPG) e Gravação 15s (MP4) direto no cabeçalho do PiP; Mosaico perfeitamente ajustado sem distorção anamórfica.
          - 🔒 **Invariantes de Ouro Preservadas**: Idempotência total no PiP, watchdog suave via `playbackRate`, MSE TCP e zero-cache no Nginx.
          - 🛡️ **Governança & Estabilidade**: 100% de aprovação na suíte `onp-spec` (31/31 testes PASS).
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

