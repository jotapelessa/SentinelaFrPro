name: Android CI Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'
        
    - name: Build Android TV and Smartphone APKs
      working-directory: android
      run: |
        chmod +x gradlew
        ./gradlew assembleTvDebug assembleSmartphoneDebug --no-daemon

    - name: Upload Android TV APK
      uses: actions/upload-artifact@v4
      with:
        name: Sentinela-Android-TV.apk
        path: android/app/build/outputs/apk/tv/debug/app-tv-debug.apk

    - name: Upload Android Smartphone APK
      uses: actions/upload-artifact@v4
      with:
        name: Sentinela-Android-Smartphone.apk
        path: android/app/build/outputs/apk/smartphone/debug/app-smartphone-debug.apk
