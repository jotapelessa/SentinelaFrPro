name: Android CI & Automatic Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'
        cache-disabled: true
        
    - name: Read & Format Version
      id: get_version
      run: |
        VERSION_FILE="android/version.properties"
        if [ -f "$VERSION_FILE" ]; then
          source "$VERSION_FILE"
        fi
        MAJOR=${MAJOR:-001}
        MINOR=${MINOR:-000}
        PATCH=${PATCH:-000}
        BUILD=${BUILD:-001}
        FORMATTED_VERSION="$(printf "%03d.%03d.%03d.%03d" "$((10#$MAJOR))" "$((10#$MINOR))" "$((10#$PATCH))" "$((10#$BUILD))")"
        TAG_NAME="v${FORMATTED_VERSION}"
        echo "version=${FORMATTED_VERSION}" >> $GITHUB_OUTPUT
        echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT
        echo "📦 Compilando Versão: ${FORMATTED_VERSION} (Tag: ${TAG_NAME})"

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Build Android TV and Smartphone APKs
      run: |
        cd android
        yes | sdkmanager --licenses || true
        chmod +x gradlew
        ./gradlew :app:assembleTvDebug :app:assembleSmartphoneDebug --stacktrace --no-daemon
        
        echo "============================================================"
        echo "📂 Listando todos os arquivos .apk encontrados:"
        echo "============================================================"
        find . -name "*.apk"
        
        mkdir -p ../release-apks
        VER="${{ steps.get_version.outputs.version }}"
        
        TV_APK=$(find app/build/outputs/apk/tv -name "*.apk" | head -n 1)
        PHONE_APK=$(find app/build/outputs/apk/smartphone -name "*.apk" | head -n 1)
        
        echo "TV APK detectado: '$TV_APK'"
        echo "Smartphone APK detectado: '$PHONE_APK'"
        
        cp -v "$TV_APK" "../release-apks/sentinela-android-tv-v${VER}.apk"
        cp -v "$TV_APK" "../release-apks/sentinela-android-tv-latest.apk"
        cp -v "$PHONE_APK" "../release-apks/sentinela-android-smartphone-v${VER}.apk"
        cp -v "$PHONE_APK" "../release-apks/sentinela-android-smartphone-latest.apk"
        
        cd ..
        echo "============================================================"
        echo "📦 Conteúdo final de release-apks/:"
        echo "============================================================"
        ls -lh release-apks/

    - name: Upload Artifacts to Run Summary
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: sentinela-apks-v${{ steps.get_version.outputs.version }}
        path: release-apks/*.apk

    - name: Publish to GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.get_version.outputs.tag }}
        name: "Sentinela Pro Client v${{ steps.get_version.outputs.version }}"
        draft: false
        prerelease: false
        make_latest: true
        overwrite: true
        fail_on_unmatched_files: true
        files: |
          release-apks/sentinela-android-tv-v${{ steps.get_version.outputs.version }}.apk
          release-apks/sentinela-android-smartphone-v${{ steps.get_version.outputs.version }}.apk
          release-apks/sentinela-android-tv-latest.apk
          release-apks/sentinela-android-smartphone-latest.apk
        body: |
          # 🛡️ Sentinela Frigate Pro - APKs de Cliente (v${{ steps.get_version.outputs.version }})

          Esta release foi gerada automaticamente pelo pipeline de CI/CD do Sentinela Frigate Pro.

          ### 📦 Aplicativos Disponíveis para Download:
          - 📺 **Android TV / TV Box**: [`sentinela-android-tv-v${{ steps.get_version.outputs.version }}.apk`](https://github.com/jotapelessa/SentinelaFrPro/releases/download/${{ steps.get_version.outputs.tag }}/sentinela-android-tv-v${{ steps.get_version.outputs.version }}.apk)
            * Navegação otimizada para D-Pad / Controle Remoto
            * Suporte a Notificações Flutuantes Picture-in-Picture (PiP 8 tamanhos)
            * Live Feed contínuo das câmeras com SSL Tailscale bypass
          - 📱 **Tablet & Smartphone**: [`sentinela-android-smartphone-v${{ steps.get_version.outputs.version }}.apk`](https://github.com/jotapelessa/SentinelaFrPro/releases/download/${{ steps.get_version.outputs.tag }}/sentinela-android-smartphone-v${{ steps.get_version.outputs.version }}.apk)
            * Interface estilo YouTube com feed vertical e suporte a toque
            * Zoom digital de até 5x e grade dinâmica de câmeras
            * Transmissão em tempo real de snapshots e eventos via WebSocket

          ### 🚀 Melhorias Desta Versão:
          - ✅ **PiP em Movimento**: Trigger do PiP ativado também por eventos de movimentação pura (CAMERA_MOTION_STATUS), além de detecções de objetos.
          - ✅ **Live PiP Overlay**: Janela flutuante no Android exibindo vídeo e imagem ao vivo com indicador de status e nome da câmera.
          - ✅ **Global SSL Bypass no Coil**: Correção completa para conexões Tailscale HTTPS (`.ts.net`) e IPs locais sem restrições de certificado.
          - ✅ **WebSocket Native Dispatch**: Handshake em tempo real entre o backend e os dispositivos pareados na tela de `/screens`.
          - ✅ **Frigate 0.17 Zone Sync**: Resolução total do Modo de Segurança (*Safe Mode*) do Frigate NVR.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

