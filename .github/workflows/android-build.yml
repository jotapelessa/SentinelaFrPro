name: Android CI & Automatic Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'
        
    - name: Read & Format Version
      id: get_version
      run: |
        VERSION_FILE="android/version.properties"
        if [ -f "$VERSION_FILE" ]; then
          source "$VERSION_FILE"
        fi
        MAJOR=${MAJOR:-001}
        MINOR=${MINOR:-000}
        PATCH=${PATCH:-000}
        BUILD=${BUILD:-001}
        FORMATTED_VERSION="$(printf "%03d.%03d.%03d.%03d" "$((10#$MAJOR))" "$((10#$MINOR))" "$((10#$PATCH))" "$((10#$BUILD))")"
        TAG_NAME="v${FORMATTED_VERSION}"
        echo "version=${FORMATTED_VERSION}" >> $GITHUB_OUTPUT
        echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT
        echo "📦 Compilando Versão: ${FORMATTED_VERSION} (Tag: ${TAG_NAME})"

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Build Android TV and Smartphone APKs
      working-directory: android
      run: |
        yes | sdkmanager --licenses || true
        chmod +x gradlew
        ./gradlew :app:assembleTvDebug :app:assembleSmartphoneDebug --stacktrace --no-daemon 2>&1 | tee gradle_build.log || BUILD_FAILED=1
        if [ "${BUILD_FAILED:-0}" = "1" ]; then
          echo "============================================================"
          echo "❌ FALHA NA COMPILAÇÃO GRADLE — ÚLTIMAS 150 LINHAS DO LOG:"
          echo "============================================================"
          tail -n 150 gradle_build.log
          exit 1
        fi
        
        echo "=== Todos os APKs gerados pelo Gradle: ==="
        find app/build/outputs -type f -name "*.apk"
        
        mkdir -p ../release-apks
        VER="${{ steps.get_version.outputs.version }}"
        
        TV_FOUND=$(find app/build/outputs -type f -name "*tv*.apk" | head -n 1)
        PHONE_FOUND=$(find app/build/outputs -type f -name "*smartphone*.apk" | head -n 1)
        
        if [ -n "$TV_FOUND" ]; then
          cp "$TV_FOUND" ../release-apks/sentinela-android-tv-v${VER}.apk
          cp "$TV_FOUND" ../release-apks/sentinela-android-tv-latest.apk
          echo "✅ TV APK copiado: $TV_FOUND"
        else
          echo "⚠️ TV APK não encontrado diretamente em app/build/outputs"
        fi
        
        if [ -n "$PHONE_FOUND" ]; then
          cp "$PHONE_FOUND" ../release-apks/sentinela-android-smartphone-v${VER}.apk
          cp "$PHONE_FOUND" ../release-apks/sentinela-android-smartphone-latest.apk
          echo "✅ Smartphone APK copiado: $PHONE_FOUND"
        else
          echo "⚠️ Smartphone APK não encontrado diretamente em app/build/outputs"
        fi
        
        ls -lh ../release-apks/

    - name: Upload Build Log on Failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: gradle-build-failure-log
        path: android/gradle_build.log

    - name: Prepare Release Artifacts
      if: success()
      run: |
        mkdir -p release-apks
        echo "📂 Verificando release-apks/..."
        ls -lh release-apks/
        
        # Se algum APK não foi copiado ainda, busca em todo o repositório
        VER="${{ steps.get_version.outputs.version }}"
        if [ ! -f "release-apks/sentinela-android-tv-latest.apk" ]; then
          TV_ANY=$(find . -type f -name "*tv*.apk" ! -path "./release-apks/*" | head -n 1)
          if [ -n "$TV_ANY" ]; then
            cp "$TV_ANY" release-apks/sentinela-android-tv-v${VER}.apk
            cp "$TV_ANY" release-apks/sentinela-android-tv-latest.apk
            echo "✅ TV APK recuperado de $TV_ANY"
          fi
        fi
        
        if [ ! -f "release-apks/sentinela-android-smartphone-latest.apk" ]; then
          PHONE_ANY=$(find . -type f -name "*smartphone*.apk" ! -path "./release-apks/*" | head -n 1)
          if [ -n "$PHONE_ANY" ]; then
            cp "$PHONE_ANY" release-apks/sentinela-android-smartphone-v${VER}.apk
            cp "$PHONE_ANY" release-apks/sentinela-android-smartphone-latest.apk
            echo "✅ Smartphone APK recuperado de $PHONE_ANY"
          fi
        fi
        
        echo "=== Conteúdo Final de release-apks/: ==="
        ls -lh release-apks/

    - name: Upload Artifacts to Run Summary
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: sentinela-apks-v${{ steps.get_version.outputs.version }}
        path: release-apks/*

    - name: Publish to GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.get_version.outputs.tag }}
        name: "Sentinela Pro Client v${{ steps.get_version.outputs.version }}"
        draft: false
        prerelease: false
        make_latest: true
        files: |
          release-apks/sentinela-android-tv-v${{ steps.get_version.outputs.version }}.apk
          release-apks/sentinela-android-smartphone-v${{ steps.get_version.outputs.version }}.apk
          release-apks/sentinela-android-tv-latest.apk
          release-apks/sentinela-android-smartphone-latest.apk
        body: |
          # 🛡️ Sentinela Frigate Pro - APKs de Cliente (v${{ steps.get_version.outputs.version }})

          Esta release foi gerada automaticamente pelo pipeline de CI/CD do Sentinela Frigate Pro.

          ### 📦 Aplicativos Disponíveis para Download:
          - 📺 **Android TV / TV Box**: [`sentinela-android-tv-v${{ steps.get_version.outputs.version }}.apk`](https://github.com/jotapelessa/SentinelaFrPro/releases/download/${{ steps.get_version.outputs.tag }}/sentinela-android-tv-v${{ steps.get_version.outputs.version }}.apk)
            * Navegação otimizada para D-Pad / Controle Remoto
            * Suporte a Notificações Flutuantes Picture-in-Picture (PiP 8 tamanhos)
            * Live Feed contínuo das câmeras com SSL Tailscale bypass
          - 📱 **Tablet & Smartphone**: [`sentinela-android-smartphone-v${{ steps.get_version.outputs.version }}.apk`](https://github.com/jotapelessa/SentinelaFrPro/releases/download/${{ steps.get_version.outputs.tag }}/sentinela-android-smartphone-v${{ steps.get_version.outputs.version }}.apk)
            * Interface estilo YouTube com feed vertical e suporte a toque
            * Zoom digital de até 5x e grade dinâmica de câmeras
            * Transmissão em tempo real de snapshots e eventos via WebSocket

          ### 🚀 Melhorias Desta Versão:
          - ✅ **PiP em Movimento**: Trigger do PiP ativado também por eventos de movimentação pura (CAMERA_MOTION_STATUS), além de detecções de objetos.
          - ✅ **Live PiP Overlay**: Janela flutuante no Android exibindo vídeo e imagem ao vivo com indicador de status e nome da câmera.
          - ✅ **Global SSL Bypass no Coil**: Correção completa para conexões Tailscale HTTPS (`.ts.net`) e IPs locais sem restrições de certificado.
          - ✅ **WebSocket Native Dispatch**: Handshake em tempo real entre o backend e os dispositivos pareados na tela de `/screens`.
          - ✅ **Frigate 0.17 Zone Sync**: Resolução total do Modo de Segurança (*Safe Mode*) do Frigate NVR.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

