services:
  mosquitto:
    container_name: sentinela_mosquitto_dev
    image: eclipse-mosquitto:2.0
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log

  backend:
    container_name: sentinela_backend_dev
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      - ./backend/data:/app/data
    environment:
      - ENVIRONMENT=development
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
      - FRIGATE_API_URL=http://localhost:5000
      - GO2RTC_API_URL=http://localhost:1984
      - DATABASE_URL=sqlite+aiosqlite:////app/data/sentinela_dev.db
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    depends_on:
      - mosquitto

  frontend:
    container_name: sentinela_frontend_dev
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080/api
      - NEXT_PUBLIC_WS_URL=ws://localhost:8080/ws
      - NEXT_PUBLIC_GO2RTC_URL=http://localhost:1984
    depends_on:
      - backend
